<!doctype html><meta charset="utf-8"><title>CIVISAR visual pairs</title><style>body{font:14px system-ui;background:#222;color:white;margin:16px}select,input{font:inherit;margin:6px}main{position:relative;width:max-content;max-width:100%}img{display:block;max-width:100%;height:auto}#react{position:absolute;top:0;left:0;opacity:.5}small{display:block;margin:8px 0}</style><h1>Prototype / React overlay</h1><label>View <select id="view"><option>main</option><option>alert</option><option>area</option><option>brief</option><option>routes</option><option>shelters</option><option>inspect</option><option>sources</option><option>signin</option><option>phone</option></select></label><label>Viewport <select id="size"><option>1440x900</option><option>1366x768</option><option>1024x768</option><option>768x1024</option><option>390x844</option></select></label><label>React opacity <input id="blend" type="range" min="0" max="100" value="50"></label><small>Prototype base; React overlay. Match is assessed by visual review, not by the presence of screenshots.</small><main><img id="prototype" alt="Original prototype"><img id="react" alt="React implementation"></main><script>function update(){const suffix=window.view.value+'-'+window.size.value+'-light.png';window.prototype.src='prototype-'+suffix;window.react.src='react-'+suffix;window.react.style.opacity=window.blend.value/100}for(const id of ['view','size','blend'])window[id].addEventListener('input',update);update()</script>
