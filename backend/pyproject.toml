[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "civisar-backend-scaffold"
version = "0.1.0"
description = "CIVISAR API scaffold; no real operational processing"
requires-python = ">=3.12"
dependencies = []
[tool.pytest.ini_options]
testpaths = ["backend/tests", "worker/tests", "tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
