name: Scaffold checks
on:
  pull_request:
  push:
    branches: [dev]
jobs:
  python-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python docs/contracts/validate_planning.py
      - run: python -m pytest
      - run: ruff check backend worker tests scripts
      - run: python -m scripts.validate_scaffold
      - run: python -m scripts.check_secrets
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
